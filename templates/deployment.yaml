apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smitele-bot.fullname" . }}
  labels:
    {{- include "smitele-bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bot.replicaCount }}
  {{/*
    Recreate, not RollingUpdate. The data PVC is ReadWriteOnce, and two pods
    holding the same Discord token would each be told to disconnect by the
    gateway. The old pod has to be gone before the new one starts.
  */}}
  strategy:
    type: Recreate
  {{/*
    Not adding component here: a Deployment's selector is immutable, so
    narrowing it on an existing release fails the upgrade. The label on the
    template is what everything else selects on, and a broader selector still
    matches it.
  */}}
  selector:
    matchLabels:
      {{- include "smitele-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smitele-bot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bot
      annotations:
        # Roll the bot onto a rotated token without needing a new image tag.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "smitele-bot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # The data PVC is provisioned root-owned; fsGroup is what lets uid 1000
        # write its caches into it.
        fsGroup: 1000
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "smitele-bot.credentialEnv" . | nindent 12 }}
            {{- if .Values.credentials.steamApiKey }}
            # Only the bot: the fast "are they even running Smite 2" probe
            # belongs to /livematch, not to any batch workload.
            - name: SMITELE_STEAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "smitele-bot.fullname" . }}
                  key: steamApiKey
            {{- end }}
            {{- if and .Values.bot.useEgressProxy .Values.credentials.egressProxy }}
            {{- include "smitele-bot.egressEnv" . | nindent 12 }}
            {{- end }}
            # ffmpeg and PIL both want a writable HOME for scratch and font
            # caching, and the root filesystem is read-only.
            - name: HOME
              value: /tmp
            - name: SMITELE_STATUS_PORT
              value: {{ .Values.bot.statusPort | quote }}
            {{- if .Values.bot.parquetOnlyCorpus }}
            # Raw JSON days expand to many times their size in memory, well
            # past this pod's limit. The bot reads only converted corpus files;
            # anything still awaiting conversion is invisible to it rather than
            # being an OOM waiting to happen.
            - name: SMITELE_CORPUS_PARQUET_ONLY
              value: "1"
            {{- end }}
          ports:
            - name: status
              containerPort: {{ .Values.bot.statusPort }}
              protocol: TCP
          {{/*
            Readiness only — no liveness probe. A wedged gateway connection is
            not something restarting reliably fixes, and a restart would kill
            any game in progress, which is the thing this whole endpoint exists
            to avoid.
          */}}
          readinessProbe:
            httpGet:
              path: /healthz
              port: status
            # The corpus load runs at startup and takes over a minute; the bot
            # is not ready until its caches are populated.
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 40
          volumeMounts:
            - name: data
              mountPath: /data
            - name: matchdata
              mountPath: /matchdata
              # The collector owns this corpus; the bot only reads it.
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.bot.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "smitele-bot.fullname" . }}-data
        - name: matchdata
          {{- if .Values.matchData.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "smitele-bot.fullname" . }}-matchdata
            readOnly: true
          {{- else }}
          {{/*
            No share yet. An empty directory keeps the mount path valid — the
            bot walks it, finds nothing, and runs without historical match data
            rather than failing to start.
          */}}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
