apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smitele-bot.fullname" . }}
  labels:
    {{- include "smitele-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  discordToken: {{ required "credentials.discordToken required in values.local.yaml" .Values.credentials.discordToken | quote }}
  hirezDevId: {{ required "credentials.hirezDevId required in values.local.yaml" .Values.credentials.hirezDevId | quote }}
  hirezAuthKey: {{ required "credentials.hirezAuthKey required in values.local.yaml" .Values.credentials.hirezAuthKey | quote }}
{{- /*
  Not required, unlike the three above: empty is the valid default and means
  tracker.gg traffic leaves from the host's own address. Omitted entirely
  rather than written empty, so that a deployment without a proxy renders an
  unchanged Secret and does not churn the checksum that restarts the bot.
*/ -}}
{{- with .Values.credentials.egressProxy }}
  egressProxy: {{ . | quote }}
{{- end }}
{{- with .Values.credentials.steamApiKey }}
  steamApiKey: {{ . | quote }}
{{- end }}
{{- /*
  The RallyHere capture. Same omit-when-empty rule as the two above, and it
  matters more here: these keys change every time you re-capture, and rendering
  them empty would churn the checksum that restarts the bot on every upgrade of
  a deployment that does not use RallyHere at all.

  Each is written independently rather than as one block, so a capture that
  missed the login request still deploys its token — the bot reads for the
  token's remaining life and reports the missing credential when it comes to
  renew, which is a far clearer failure than a chart that silently drops it.
*/ -}}
{{- with .Values.credentials.rallyHere }}
{{- with .token }}
  rallyHereToken: {{ . | quote }}
{{- end }}
{{- with .refreshToken }}
  rallyHereRefreshToken: {{ . | quote }}
{{- end }}
{{- with .clientBasic }}
  rallyHereClientBasic: {{ . | quote }}
{{- end }}
{{- with .baseUrl }}
  rallyHereBaseUrl: {{ . | quote }}
{{- end }}
{{- end }}
