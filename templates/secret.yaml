apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smitele-bot.fullname" . }}
  labels:
    {{- include "smitele-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  discordToken: {{ required "credentials.discordToken required in values.local.yaml" .Values.credentials.discordToken | quote }}
  hirezDevId: {{ required "credentials.hirezDevId required in values.local.yaml" .Values.credentials.hirezDevId | quote }}
  hirezAuthKey: {{ required "credentials.hirezAuthKey required in values.local.yaml" .Values.credentials.hirezAuthKey | quote }}
{{- /*
  Not required, unlike the three above: empty is the valid default and means
  tracker.gg traffic leaves from the host's own address. Omitted entirely
  rather than written empty, so that a deployment without a proxy renders an
  unchanged Secret and does not churn the checksum that restarts the bot.
*/ -}}
{{- with .Values.credentials.egressProxy }}
  egressProxy: {{ . | quote }}
{{- end }}
{{- with .Values.credentials.steamApiKey }}
  steamApiKey: {{ . | quote }}
{{- end }}
