{{- if .Values.smite2.collector.enabled }}
{{- if not .Values.matchData.enabled }}
{{- fail "smite2.collector.enabled requires matchData.enabled — the crawl has nowhere durable to write" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "smitele-bot.fullname" . }}-s2collector
  labels:
    {{- include "smitele-bot.labels" . | nindent 4 }}
spec:
  suspend: {{ .Values.smite2.collector.suspend }}
  schedule: {{ .Values.smite2.collector.schedule | quote }}
  {{- with .Values.smite2.collector.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.smite2.collector.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.smite2.collector.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.smite2.collector.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      {{/*
        Retries belong to each source worker; Kubernetes must not restart
        the whole job and discard its source-specific backoff.
      */}}
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.smite2.collector.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "smitele-bot.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: s2collector
        spec:
          restartPolicy: Never
          {{/*
            The crawl turns SIGTERM into a cancellation and saves its indexes on
            the way out. That is only worth anything if the kubelet waits long
            enough for a parquet write to the SMB share to land.
          */}}
          terminationGracePeriodSeconds: {{ .Values.smite2.collector.terminationGracePeriodSeconds }}
          {{- include "smitele-bot.imagePullSecrets" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: s2collector
              image: "{{ .Values.smite2.collector.image.repository }}:{{ .Values.smite2.collector.image.tag | default .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-u", "./src/smite2_collector/collect_sources.py"]
              args:
                {{- range .Values.smite2.collector.seeds }}
                - --seed
                - {{ . | quote }}
                {{- end }}
                - --budget
                - {{ .Values.smite2.collector.requestBudget | quote }}
                - --minutes
                - {{ mulf .Values.smite2.collector.wallClockHours 60 | int | quote }}
                - --max-matches
                - {{ .Values.smite2.collector.maxMatches | quote }}
                - --interval
                - {{ .Values.smite2.collector.requestIntervalSeconds | quote }}
                - --jitter
                - {{ .Values.smite2.collector.requestIntervalJitter | quote }}
                - --since-days
                - {{ .Values.smite2.collector.sinceDays | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                {{- with .Values.credentials.egressProxy }}
                {{- include "smitele-bot.egressEnv" $ | nindent 16 }}
                {{- end }}
                - name: HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp/.config
                - name: XDG_DATA_HOME
                  value: /tmp/.local/share
                - name: SMITELE_S2_MATCH_DATA_DIR
                  value: /matchdata/smite2/output
                - name: SMITELE_S2_MATCH_ARCHIVE_DIR
                  value: /matchdata/smite2/archive
              volumeMounts:
                - name: matchdata
                  mountPath: /matchdata
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.smite2.collector.resources | nindent 16 }}
          volumes:
            - name: matchdata
              persistentVolumeClaim:
                claimName: {{ include "smitele-bot.fullname" . }}-matchdata
            {{/*
              Same reasoning as the Smite 1 collector: the bot's PVC is
              ReadWriteOnce and sharing it would pin this to the bot's node.
              The wiki cache is rebuilt in about ten seconds.
            */}}
            - name: data
              emptyDir: {}
            - name: tmp
              emptyDir:
                {{/* A browser needs considerably more scratch than a script. */}}
                sizeLimit: 2Gi
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
