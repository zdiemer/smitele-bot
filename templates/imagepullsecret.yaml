{{- if .Values.imageCredentials.pat }}
{{/*
Deliberately not named "*-secret.yaml": in the sibling selfhosted repo that
glob is gitignored for rendered manifests and silently swallows chart templates
named that way. Keeping the name distinct here avoids inheriting that trap if
this file is ever copied across.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smitele-bot.fullname" . }}-ghcr
  labels:
    {{- include "smitele-bot.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{%q:{\"auth\":%q}}}" .Values.imageCredentials.registry (printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.pat | b64enc) | b64enc }}
{{- end }}
