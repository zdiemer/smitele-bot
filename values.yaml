image:
  repository: ghcr.io/zdiemer/smitele-bot
  tag: "1.9.9"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Discord token + Hi-Rez developer credentials. All three live in
# values.local.yaml — never here. They reach both the bot and the collector as
# environment variables; the code still accepts a config.json, but nothing
# mounts one in the cluster.
credentials:
  discordToken: ""
  hirezDevId: ""
  hirezAuthKey: ""
  # A Steam Web API key (steamcommunity.com/dev/apikey). Optional: with one,
  # /livematch can tell "tracker.gg is lagging" apart from "not playing" by
  # asking Steam whether the player is running Smite 2 right now. Empty means
  # the bot answers from tracker.gg alone, as it always has.
  steamApiKey: ""
  # Where tracker.gg traffic leaves from. Empty means the host's own address,
  # which is what every deployment did before this existed. Contains a password,
  # so it belongs in values.local.yaml with the rest.
  #
  #   http://user:password@host:port
  #
  # It MUST be a sticky exit — one address held for hours. A rotating pool
  # breaks this outright: the Cloudflare cookie is bound to the address that
  # solved the challenge, so a cookie minted on one exit and replayed from
  # another is refused, and each refusal costs a solve out of a budget of
  # twelve a day. See docs/proxy-setup.md, which also has the bandwidth maths
  # that rules out per-gigabyte providers.
  egressProxy: ""

bot:
  # One replica, always. The Discord gateway allows a single connection per
  # token, and a second pod would fight the first for it.
  replicaCount: 1
  # Whether the bot shares the collector's egress. On by default, and that is
  # the recommended posture: the two share one clearance file so the bot reuses
  # the collector's solve rather than minting its own, and splitting them across
  # two addresses halves that sharing and doubles the daily solves. Turn it off
  # only to keep the bot's handful of per-command requests off metered proxy
  # bandwidth — the per-egress keying is what makes that safe rather than a
  # silent 403 storm.
  useEgressProxy: true
  # Serves /healthz: readiness, plus the in-progress game counts that
  # upgrade.sh refuses to roll over. Cluster-internal only.
  statusPort: 8080
  # Ignore un-converted JSON days. Raw JSON expands to many times its size in
  # memory — far past this pod's limit — so the bot reads only Parquet and
  # anything awaiting conversion is simply invisible to it.
  parquetOnlyCorpus: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      # The aggregate is loaded whole at startup: 18.2M build groups over a
      # 250-day corpus is ~2.4Gi resident. 2Gi OOM-looped the bot the moment
      # the full aggregate landed. This scales with the corpus, so it is the
      # value to watch — loading per-god rather than wholesale would make it
      # flat, and is the obvious next step if it keeps climbing.
      memory: 5Gi

# upgrade.sh refuses to roll the Deployment while a Smite-le or trivia round is
# in progress, since a restart drops them mid-question. Override for a single
# run with `./upgrade.sh --force-active-sessions`.
deployGuard:
  enabled: true

# Small, private, per-replica state: the Hi-Rez session token, the patch
# version marker, the gods/items API caches, and downloaded god/item/skin art.
# Regenerable — losing it costs a handful of API calls on the next start — but
# keeping it across restarts avoids re-downloading a few hundred images.
persistence:
  data:
    size: 5Gi
    storageClass: truenas-nfs     # NAS-backed; only ~350 files, NFS is fine here
    accessMode: ReadWriteOnce

# The match-detail corpus, on the NAS over SMB. Grows daily and is shared
# between the collector (writes) and the bot (reads), so it is neither local
# nor single-writer — it needs ReadWriteMany, which local-path cannot do.
#
# DISABLED BY DEFAULT: this needs an SMB share that must be created on the NAS
# first (see README §Prerequisites). With it off, the bot runs fine and simply
# has no historical match data to draw builds from.
matchData:
  enabled: false
  host: "192.168.4.36"        # the NAS on the LAN
  share: "smite"              # //192.168.4.36/smite
  vers: "3.0"                 # Pin SMB protocol; TrueNAS speaks 3.x
  size: 500Gi
  mountOptions:
    - dir_mode=0775
    - file_mode=0664
    - noserverino
  # SMB username/password live in values.local.yaml.
  username: ""
  password: ""

# The daily match data collector. This was a Windows Task Scheduler job; here
# it is a CronJob running the same script in the same image as the bot.
#
# Requires matchData.enabled — there is nowhere to write the corpus otherwise,
# and a run that wrote to the pod's own disk would vanish with the pod.
collector:
  enabled: false
  # 09:20 UTC. Hi-Rez only publishes match IDs for completed days, so this
  # collects *yesterday*; the offset past midnight is slack for their data to
  # settle, and the odd minute keeps it off the top-of-hour stampede.
  schedule: "20 9 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  # A full day is ~1,700 match-ID requests plus a batched details pass. Six
  # hours is far more than observed runs need and still bounds a stuck job well
  # inside the next day's window.
  activeDeadlineSeconds: 21600
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi

# Recovering a gap in the corpus, a slice at a time.
#
# The window that matters is SHORT, and it is not the one the API advertises.
# `getmatchidsbyqueue` serves match IDs for 180 days, but `getmatchdetailsbatch`
# only returns rows for about 31 of them: past that every ID comes back with
# Active_Flag "y" and yields zero player rows. Measured 2026-08-07, the flip was
# at 2026-07-07, exactly. So a gap older than a month is not recoverable at any
# budget — only the last ~31 days of it are, and that edge moves forward a day
# every day.
#
# Which means: set this the day you notice the gap and let it run. A month-long
# hole is two runs' work; waiting a week to start turns a week of it into
# nothing. Days already on disk are skipped for free, so re-running is cheap and
# the job ends by itself.
#
# `maxDays` paces against the 75,000 daily requests. A day costs ~2,500 and
# takes ~15 minutes, so 20 days is ~50,000 requests and ~5 hours, leaving the
# nightly collector and the bot their share.
#
# Disable this once `until` has been reached; it costs nothing to leave running
# but it is a job with an end.
backfill:
  enabled: false
  # 12:00 UTC — after the nightly collector at 09:20 has finished and spent its
  # share, so the two never compete for the same day's quota.
  schedule: "0 12 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # No retry. A failed slice loses at most the day it was on, and every day it
  # already wrote is skipped by the next run — so re-running the schedule is a
  # better recovery than restarting a job that has already spent its requests.
  backoffLimit: 0
  # 11 hours: 20 days at ~28 minutes, with room for slow ones.
  activeDeadlineSeconds: 39600
  # Oldest first. Empty `from` disables the job's schedule guard, so set both.
  from: ""
  until: ""
  maxDays: 20
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi

# Weekly retrain of the build-recommendation model, which the bot loads from
# the match-data share. Needs matchData.enabled — there's no corpus otherwise.
#
# Measured on 21 days (910k full-build rows): test AUC 0.675, a few minutes on
# CPU. Both artefacts are tiny — 0.20MB model, 0.12MB candidate builds.
trainer:
  enabled: false
  image:
    repository: ghcr.io/zdiemer/smitele-bot-trainer
    # Empty so this tracks image.tag, keeping the trainer and the bot that
    # scores its output on the same code.
    #
    # Was pinned to 1.6.4 through the 1.7.0 release, whose build was skipped —
    # an empty tag would have pointed the CronJob at a trainer image that was
    # never pushed. Unpinned at 1.8.25, whose `./build.sh` did push
    # smitele-bot-trainer:1.8.25; verified present in GHCR before clearing
    # this, since the failure mode is a Sunday-morning ImagePullBackOff that
    # nothing notices until the model is a week stale.
    tag: ""
  # 04:40 Sunday UTC — after the daily collector, well away from it.
  schedule: "40 4 * * 0"
  timeZone: "Etc/UTC"
  # Days of corpus to train on — days, not files: a day is written as however
  # many Parquet parts its size needs, and this used to slice the file list, so
  # "60" was fetching about four days' worth. More is better up to the point
  # the meta shifts underneath it; a patch is roughly a month.
  # The whole corpus. Ranked Conquest is only ~8% of collected matches, so a
  # 30-day window yielded under 300k usable rows where the model wants
  # millions; the row cap keeps the cost bounded regardless of how many days
  # that turns out to be.
  days: 3650
  epochs: 10
  # Ranked Conquest. Builds are queue-specific, so mixing modes would average
  # over strategies that have nothing to do with each other.
  queues:
    - 451
  threads: 2
  activeDeadlineSeconds: 5400
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 12Gi

# Rolls the corpus into per-build win counts for /build. This is what makes a
# 250-day corpus usable: the raw rows are ~132M and ~36GB in pandas, where the
# aggregate of the same data measured under 0.1MB for 21 days. The bot loads
# the aggregate and never the corpus.
aggregate:
  enabled: false
  # 10:10 UTC, after the 09:20 collector, so the day it just wrote is included.
  schedule: "10 10 * * *"
  timeZone: "Etc/UTC"
  # Builds seen fewer times than this are dropped. They were 96% of the groups
  # in the 21-day sample and carry no signal — the ranking's confidence
  # interval already puts a build with one play near zero.
  minPlays: 3
  # Empty means the whole corpus. Set to limit to the most recent N days.
  days: ""
  # Two passes over ~3,300 files on a network share. Pass 1 is quick (~24 min,
  # nine columns); pass 2 reads twenty columns and re-folds a running total that
  # grows to millions of rows, so it dominates at roughly three hours. The
  # previous three-hour deadline would have killed a full run with ~45 minutes
  # left, after the expensive part was already done.
  activeDeadlineSeconds: 28800
  # The running total is the whole cost: a full corpus reaches tens of millions
  # of groups before min-plays can be applied, and that filter needs complete
  # counts so it cannot run early. Request matches limit — a burstable pod that
  # grows into a limit the node cannot honour is how two nodes were lost.
  resources:
    requests:
      cpu: "1"
      memory: 12Gi
    limits:
      memory: 12Gi

# One-shot bulk conversion of archived JSON days to Parquet. Enable, watch it
# finish, then disable again. Re-running is safe: already-converted days are
# skipped, so a failed shard just gets re-run.
#
# The converter streams, so memory is set by batchRows and not by file size —
# archived days reach 3GB, which no node here could parse whole.
corpusConvert:
  enabled: false
  workers: 4
  batchRows: 50000
  # Leave false for the first pass. Once the Parquet output looks right, set it
  # and re-run to drop the JSON originals — until then every converted day is
  # on the share twice.
  delete: false
  backoffLimit: 4
  # Request what it actually uses, not a fraction of it. With a 1Gi request
  # and a 3Gi limit the scheduler was happy to place a worker on a 2.6GB
  # laptop, where ballooning to the limit took the whole node down — two of
  # them, before the pattern was obvious. Matching request to limit means a
  # worker only lands somewhere that can genuinely hold it.
  resources:
    requests:
      cpu: 500m
      memory: 3Gi
    limits:
      memory: 3Gi

# --- Smite 2 -----------------------------------------------------------------
#
# Static data (gods, items, abilities, art) comes from wiki.smite2.com and needs
# no configuration: it is a public MediaWiki API, about twenty requests, cached
# on disk and invalidated by a hash of the pages' revision ids. The bot picks it
# up automatically, and falls back to a Smite-1-only bot if the wiki is
# unreachable.
#
# Everything below is about match data, which comes from tracker.gg instead.
smite2:
  collector:
    # Off by default, and this is not an oversight. tracker.gg's API is
    # undocumented, sits behind a WAF, publishes no rate limit, and grants no
    # allowance for bulk reads. A `helm upgrade` must never start crawling it
    # by accident — turning this on is a decision someone makes deliberately.
    enabled: false
    image:
      repository: ghcr.io/zdiemer/smitele-bot-s2collector
      # Defaults to image.tag, so the crawl and the bot always agree about the
      # corpus format.
      tag: ""
    # 02:40 UTC. Nothing depends on the hour — there is no "yesterday" to wait
    # for, because matches are reachable per player rather than per day — so
    # this is simply a quiet time.
    schedule: "40 2 * * *"
    timeZone: "Etc/UTC"
    # Requests per night — a ceiling, not the binding constraint. What actually
    # bounds a night is the quota below and the wall clock: at 300 requests an
    # hour over eighteen hours the run can reach ~5,400, so a budget under that
    # will cut it short. An "exit_reason" of "budget" on the status page means
    # this number is too low; "deadline" means the night went as intended.
    requestBudget: 6000
    # Seconds between requests.
    #
    # Measured 2026-08-07: the limit is a **request quota, not a rate**. Bursts
    # at 1.0s and at 1.5s were both refused at request 300 exactly, ten minutes
    # apart, each carrying `Retry-After: 3600`. That is why raising this never
    # helped, and why an earlier probe saw a refusal arrive *sooner* at a slower
    # pace — there was no rate to find.
    #
    # So this is now about politeness rather than protection: it spreads 300
    # requests over the hour instead of firing them in ten minutes. 12s is the
    # quota rate exactly; below that the run simply reaches the refusal sooner
    # and waits longer, for the same total.
    requestIntervalSeconds: 12.0
    # Fraction of the interval added back at random, so the request train does
    # not arrive on a metronome. This only ever *widens* a gap — the interval
    # above stays a floor — so it costs a slightly shorter night and cannot
    # move the pace in the dangerous direction.
    requestIntervalJitter: 0.4
    # A hard stop. Long on purpose: the quota resets hourly, so the length of
    # the run is what decides how many resets it gets to spend. 02:40 + 18h
    # finishes at 20:40, leaving six hours before the next fire — enough that
    # concurrencyPolicy: Forbid never silently drops a slot.
    #
    # Two consequences worth knowing. The 06:50 aggregate now reads a corpus
    # being written; merge_day is atomic per file so it sees whole days, just
    # not the newest rows of days still in flight. And the six-hourly snapshot
    # jobs now land inside the crawl window, at ~20 requests each.
    wallClockHours: 18
    # Longest single pause to serve when the site asks for one. The measured
    # reset is an hour, so this covers it with room spare; beyond this a
    # refusal is treated as a stop rather than a wait.
    maxWaitMinutes: 90
    # How often to put the indexes on disk. A run this long that is killed
    # between checkpoints refetches everything since the last one — and counts
    # all of it as new.
    checkpointMinutes: 10
    # Pages of history per player, 25 matches each — about three days. One is
    # right for a nightly run, which only has to cover the time since the last
    # one; anything more re-reads what yesterday already has. Raise it, with
    # sinceDays, for a one-off backfill of days that predate the collector.
    pages: 1
    # With pages > 1, how far back to walk before giving up on a player, so an
    # account that stopped playing is not paged to the beginning of time.
    sinceDays: 0
    # Stop early once the recent days look this covered, measured by
    # capture-recapture rather than assumed. 0 disables it and spends the whole
    # budget. Treat the estimate as an upper bound — premades bias it high.
    coverageTarget: 0
    startingDeadlineSeconds: 3600
    successfulJobsHistoryLimit: 2
    failedJobsHistoryLimit: 3
    # Enough for a browser plus a streaming JSON parse. The crawl itself is
    # bounded by the row buffer, not by response size — responses are never
    # held whole.
    # Must stay comfortably above wallClockHours x 3600, so the crawl's own
    # graceful stop wins over the kubelet's kill and it saves on the way out.
    activeDeadlineSeconds: 72000
    # Long enough for a final flush of parquet to the SMB share. Without it the
    # SIGTERM handler is decoration.
    terminationGracePeriodSeconds: 120
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi

  aggregate:
    enabled: false
    # After the crawl. Note a day's numbers keep moving for a few days after
    # it, because the crawl backfills roughly three calendar days at a time
    # rather than closing one.
    schedule: "50 6 * * *"
    timeZone: "Etc/UTC"
    # Lower than Smite 1's, because the corpus is far smaller: a build seen
    # three times in a thin corpus is a real pattern, where in 250 days of
    # Smite 1 data it is noise.
    minPlays: 2
    days: null
    activeDeadlineSeconds: 3600
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi

# --- smite.diemer.codes -------------------------------------------------------
#
# A public read-only site: how fresh each corpus and aggregate is, whether the
# Hi-Rez quota is under pressure, whether the Smite 2 crawl is inside a block,
# and cached Smite 1 stats for the roster.
#
# The shape is the point. Everything it shows is read from JSON that `snapshot`
# below writes on a schedule; the web pod holds no credentials and opens no
# connection to Hi-Rez or tracker.gg. That is what makes it safe to publish —
# both upstreams are metered (75,000 requests and 500 sessions a day; twelve
# Cloudflare solves) and a shared link must not be able to spend either.
#
# Requires matchData.enabled: the snapshots live on the share, because the
# CronJob that writes them and the web pods that read them are different pods.
web:
  enabled: false
  image:
    repository: ghcr.io/zdiemer/smitele-bot-web
    # Defaults to image.tag, so the site and the snapshot format agree.
    tag: ""
  # Two, unlike the bot's one. Nothing here is stateful — the only input is a
  # file on a ReadWriteMany mount, read-only — so this neither needs the
  # gateway's single-connection rule nor the Recreate strategy that the bot's
  # ReadWriteOnce volume forces.
  replicaCount: 2
  port: 8080
  ingress:
    enabled: true
    className: traefik
    # The internal name, and the only one with a real certificate: DNS-01
    # against DuckDNS via the wildcard SAN below.
    host: smite.zachd.duckdns.org
    # The external name, served over the shared Cloudflare tunnel. TLS for these
    # terminates at Cloudflare's edge, so they are deliberately absent from the
    # ACME cert list — asking the duckdns resolver for a diemer.codes cert fails
    # DNS-01, and one failing domain can take the whole order down including the
    # wildcard.
    #
    # The hostname → origin mapping is NOT in git: it is a Public Hostname entry
    # on the shared tunnel in the Cloudflare dashboard, pointing at
    # https://traefik.kube-system.svc.cluster.local:443 with No TLS Verify on
    # and a blank Host header. See infra/cloudflared in the selfhosted repo.
    cloudflareHosts:
      - smite.diemer.codes
    tls:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # It parses one JSON document per snapshot write and serves ~270KB of
      # static assets. The limit is here to bound a leak, not to fit a
      # measurement — nothing observed has come close to it.
      memory: 256Mi

# Writes what the site serves. Two schedules over one script, because the two
# halves cost wildly different amounts.
snapshot:
  enabled: false
  # Liveness: two Hi-Rez calls plus a handful of stat()s on the share. Cheap
  # enough to run at this cadence, which is what lets the page answer "is the
  # crawl blocked *right now*".
  liveness:
    schedule: "*/15 * * * *"
    activeDeadlineSeconds: 300
  # The roster's Smite 1 stats: ~120 Hi-Rez requests, paced two seconds apart
  # between players because Hi-Rez answers a sustained burst with HTML error
  # pages rather than queueing it. These numbers move over weeks, so six-hourly
  # is generous; at fifteen minutes it would spend 11.5k requests a day for
  # nothing.
  players:
    schedule: "20 */6 * * *"
    activeDeadlineSeconds: 900
  # The corpus breakdown: plays by queue, god and role, read from the
  # aggregate's per-god table (83KB for Smite 1, 37KB for Smite 2) rather than
  # from the corpus itself. Also resolves god and queue names, which costs a
  # cached Hi-Rez catalogue and a cached wiki read. The aggregate behind it
  # rebuilds once a day at 10:10 UTC, so this runs shortly after and again
  # through the day in case that run was late.
  stats:
    schedule: "40 */6 * * *"
    activeDeadlineSeconds: 900
  timeZone: "Etc/UTC"
  # Where both jobs write and the web pods read. On the share rather than the
  # bot's PVC, because that one is ReadWriteOnce and private to the bot.
  dir: /matchdata/web
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      # Reads two Parquet files by column — the frontier and the seen-match
      # index — and never the corpus itself.
      memory: 512Mi

# The convention here is a *public* GHCR package: the cluster is multi-node and
# anonymous pulls mean no per-namespace credential to keep alive. Until the
# package visibility is flipped, a PAT with read:packages in values.local.yaml
# generates a pull secret. Clear it once the package is public.
imageCredentials:
  registry: ghcr.io
  username: zdiemer
  pat: ""

# Any additional, externally-managed pull secrets.
imagePullSecrets: []

nodeSelector: {}
tolerations: []
