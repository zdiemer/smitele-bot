<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Smite · data and API liveness</title>
    <meta
      name="description"
      content="Scraper and API liveness for the Smite 1 and Smite 2 data behind Smite-le."
    />

    <!--
      One SVG, used directly. Supported everywhere that matters, and a single
      file beats a pile of PNGs at four sizes. iOS is the exception — it will
      not take SVG — so the touch icon is the one raster we keep.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="theme-color" content="#14171a" />

    <!--
      Android needs the manifest, not just the touch icon: without one, "Add to
      home screen" has no name and no artwork to use and falls back to cropping
      a screenshot. The 192/512 it names are rendered by serve.py off the same
      polygon as /icon-180.png, plus a maskable 512 drawn inside Android's 80%
      safe circle — the motion lines run close enough to the edge that the
      uncropped artwork loses its outermost blue and magenta strokes.

      A static file in public/, which Vite copies to dist/ verbatim, rather than
      another route: it never changes and it names files that do not either.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      The preview card is /og.png, drawn by serve.py from whatever the snapshot
      last wrote and cached against its mtime. Nothing about it is checked in or
      generated at build time: a static card would be a photograph of the
      numbers on the day it was exported, and for a site whose whole subject is
      freshness that is worse than having none.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="smite.diemer.codes" />
    <meta property="og:title" content="Smite · data and API liveness" />
    <meta
      property="og:description"
      content="How fresh the Smite 1 and Smite 2 corpora are, whether either upstream is refusing us, and what is actually in the data."
    />
    <meta property="og:url" content="https://smite.diemer.codes/" />
    <meta property="og:image" content="https://smite.diemer.codes/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
